name = "Leslie2"
version = "0.1.0"
keywords = ["math"]
# The default targets are also what gets API documentation: the docs build
# generates one `:docs` facet per default target, and the blueprint links into
# those pages, so a library the blueprint cites must be listed here.
defaultTargets = ["Leslie2", "Leslie2Protocols"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0-rc1"


[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "main"
[[lean_lib]]
name = "Leslie2"

# Opt-in library for the exploratory work (fairness + measure-theoretic trace
# semantics) that builds on top of the core. Not a default target, so `lake
# build` compiles only the core; build it explicitly with
# `lake build Leslie2Extra`.
[[lean_lib]]
name = "Leslie2Extra"

# The protocol case studies (the ABA development following the "Verifying ABA
# with Leslie" blueprint). Builds on top of the core, and is a default target
# so that `lake build` covers it and the docs build documents the declarations
# the blueprint links to.
[[lean_lib]]
name = "Leslie2Protocols"