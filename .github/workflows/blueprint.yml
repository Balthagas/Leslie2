name: Compile blueprint

on:
  push:
    branches:
      - main   # the branch this repo actually develops and pushes on
      - master # the remote's historical default branch
  workflow_dispatch:        # Allow manual triggering of the workflow from the GitHub Actions interface

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read          # Read access to repository contents
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens
  issues: write           # Write access to issues
  pull-requests: write    # Write access to pull requests

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Build and lint project
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          build: true
          lint: false
          mk_all-check: true

      - name: Build extras library (fairness + measure)
        run: lake build Leslie2Extra

      - name: Build protocols library (ABA case study)
        run: lake build Leslie2Protocols

      # plasTeX 3.1 silently breaks on Python 3.14: its plugins fail to load, the
      # \lean/\uses macros fall back to the default renderers, and neither the
      # dependency graph nor lean_decls is emitted -- with a zero exit code. The
      # 3.13 pin is load-bearing; do not float it to the runner default.
      - name: Set up Python for the concise blueprint edition
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install leanblueprint (pulls plasTeX and its three plugins)
        run: pip install leanblueprint

      # Ordering constraint: this step MUST run before "Compile blueprint and
      # documentation" below. It overwrites blueprint/lean_decls with the concise
      # edition's subset of declarations; the full `leanblueprint web` inside the
      # docgen-action step then regenerates the authoritative file that
      # `checkdecls` reads. Only the web edition is built here -- there is no TeX
      # toolchain on the runner outside the docgen-action container, so the
      # concise PDF is deliberately not built in CI.
      - name: Build concise blueprint edition and stage it for deployment
        run: |
          cd blueprint/src && plastex -c plastex-min.cfg web-min.tex && cd ../..
          mkdir -p home_page/blueprint-min
          cp -r blueprint/web-min/. home_page/blueprint-min/

      - name: Compile blueprint and documentation
        uses: leanprover-community/docgen-action@deed0cdc44dd8e5de07a300773eb751d33e32fc8 # 2025-10-26
        with:
          blueprint: true
          homepage: home_page