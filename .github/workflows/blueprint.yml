name: Compile blueprint

on:
  push:
    branches:
      - main   # the branch this repo actually develops and pushes on
      - master # the remote's historical default branch
  # A manual run builds the libraries, both blueprint editions and the
  # declaration checks, but it does NOT publish: every deployment step inside
  # the docgen-action below (API documentation, the Jekyll build, the Pages
  # artifact upload and the deployment itself) is gated on
  # `github.event_name == 'push'`, so a dispatched run reports success while
  # skipping all four. Publish by pushing to a branch listed above.
  workflow_dispatch:        # Allow manual triggering of the workflow from the GitHub Actions interface

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read          # Read access to repository contents
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens
  issues: write           # Write access to issues
  pull-requests: write    # Write access to pull requests

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Build and lint project
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          build: true
          lint: false
          mk_all-check: true

      - name: Build extras library (fairness + measure)
        run: lake build Leslie2Extra

      - name: Build protocols library (ABA case study)
        run: lake build Leslie2Protocols

      # plasTeX 3.1 silently breaks on Python 3.14: its plugins fail to load, the
      # \lean/\uses macros fall back to the default renderers, and neither the
      # dependency graph nor lean_decls is emitted -- with a zero exit code. The
      # 3.13 pin is load-bearing; do not float it to the runner default.
      - name: Set up Python for the full blueprint edition
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # plasTeX locates blueprint.sty through `kpsewhich`, so it needs a TeX
      # installation even though it renders HTML and compiles nothing. Without
      # one it degrades instead of failing: the pages render, the exit code is
      # zero, and the blueprint package never loads, which costs every Lean
      # cross-link and leaves the dependency graph empty. Graphviz is the build
      # dependency of pygraphviz, which the dependency-graph plugin imports.
      - name: Install leanblueprint (pulls plasTeX and its three plugins)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-base graphviz libgraphviz-dev
          pip install leanblueprint

      # Ordering constraint: this step MUST run before "Compile blueprint and
      # documentation" below. It overwrites blueprint/lean_decls with the full
      # edition's declarations; the default `leanblueprint web` inside the
      # docgen-action step then regenerates the file that its own `checkdecls`
      # reads, from the default edition's harvest. Only the web edition is built
      # here -- there is no TeX toolchain on the runner outside the docgen-action
      # container, so the full PDF is deliberately not built in CI.
      - name: Build full blueprint edition and stage it for deployment
        run: |
          kpsewhich --version | head -1
          cd blueprint/src && plastex -c plastex-full.cfg web-full.tex && cd ../..
          python3 scripts/check-web-build.py blueprint/web-full
          mkdir -p home_page/blueprint-full
          cp -r blueprint/web-full/. home_page/blueprint-full/

      # The full edition names declarations the default edition does not (its rule
      # tables in particular), so the default harvest does not cover them: this
      # checkdecls run against the full edition's lean_decls is the only check
      # those declarations get. It must run while lean_decls still holds the full
      # harvest, i.e. before the docgen-action step overwrites it.
      # check-lean-prose covers what checkdecls cannot: the objects the prose sets
      # as \mathrm{...} are not harvested declarations, so a rename leaves its old
      # name in the prose without failing anything.
      - name: Check the full edition's declarations and node sync
        run: |
          lake exe checkdecls blueprint/lean_decls
          python3 scripts/check-node-sync.py
          python3 scripts/check-lean-prose.py

      - name: Compile blueprint and documentation
        uses: leanprover-community/docgen-action@deed0cdc44dd8e5de07a300773eb751d33e32fc8 # 2025-10-26
        with:
          blueprint: true
          homepage: home_page